<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark-purple">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Host · 管理后台</title>
<style>
:root, [data-theme="dark-purple"]{
  --bg:#0b0d14;--panel:rgba(255,255,255,.04);--panel-2:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.09);--border-hi:rgba(139,109,255,.4);
  --text:#f2f3f7;--muted:#9aa0b4;--faint:#626880;
  --primary:#8b6dff;--primary-2:#a78bff;--accent:#4dd6ff;--pink:#ff6b9d;
  --green:#3ddc97;--yellow:#ffd166;--red:#ff5c7c;
  --radius:16px;--shadow:0 12px 40px rgba(0,0,0,.5);
}
[data-theme="dark-cyan"]{
  --bg:#071014;--panel:rgba(255,255,255,.04);--panel-2:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08);--border-hi:rgba(77,214,255,.35);
  --text:#eef6f8;--muted:#8fa6ad;--faint:#5a7078;
  --primary:#2ec4e6;--primary-2:#66d8f0;--accent:#8b6dff;--pink:#ff6b9d;
  --green:#3ddc97;--yellow:#ffd166;--red:#ff5c7c;
}
[data-theme="light"]{
  --bg:#f6f7fb;--panel:rgba(255,255,255,.72);--panel-2:#ffffff;
  --border:rgba(15,23,42,.1);--border-hi:rgba(124,92,252,.35);
  --text:#0f172a;--muted:#55607a;--faint:#8a93a8;
  --primary:#6a4be0;--primary-2:#7c5cfc;--accent:#0ea5c4;--pink:#e0487a;
  --green:#16a373;--yellow:#c98a00;--red:#e0486a;
}
[data-theme="oled"]{
  --bg:#000000;--panel:rgba(255,255,255,.03);--panel-2:rgba(255,255,255,.05);
  --border:rgba(255,255,255,.1);--border-hi:rgba(139,109,255,.4);
  --text:#f5f5f7;--muted:#8a8a96;--faint:#55555f;
  --primary:#8b6dff;--primary-2:#a78bff;--accent:#4dd6ff;--pink:#ff6b9d;
  --green:#3ddc97;--yellow:#ffd166;--red:#ff5c7c;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(800px 400px at 20% -10%,color-mix(in srgb,var(--primary) 14%,transparent),transparent 60%),
             radial-gradient(600px 300px at 85% 100%,color-mix(in srgb,var(--accent) 8%,transparent),transparent 55%)}

#login{display:flex;align-items:center;justify-content:center;height:100vh;padding:1.5rem}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:22px;
  padding:2.5rem;width:370px;text-align:center;backdrop-filter:blur(16px);box-shadow:var(--shadow)}
.login-logo{width:56px;height:56px;margin:0 auto 1.1rem;border-radius:16px;
  background:linear-gradient(135deg,var(--primary),var(--pink));
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;
  box-shadow:0 8px 24px color-mix(in srgb,var(--primary) 40%,transparent)}
.login-card h1{font-size:1.35rem;font-weight:700;margin-bottom:.25rem}
.login-card p{color:var(--muted);font-size:.85rem;margin-bottom:2rem}
.login-card input{width:100%;padding:.85rem 1rem;border-radius:12px;border:1px solid var(--border);
  background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--text);font-size:.95rem;margin-bottom:1rem;outline:none;transition:.2s}
.login-card input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.login-card button{width:100%;padding:.85rem;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),#6a4be0);color:#fff;
  font-size:.95rem;font-weight:600;cursor:pointer;transition:.2s}
.login-card button:hover{transform:translateY(-1px);box-shadow:0 8px 24px color-mix(in srgb,var(--primary) 40%,transparent)}

#app{display:none;max-width:1080px;margin:0 auto;padding:2rem 1.5rem}
.topbar{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:1.8rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border);gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.7rem}
.brand-icon{width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--pink));
  display:flex;align-items:center;justify-content:center;font-size:1rem;
  box-shadow:0 4px 12px color-mix(in srgb,var(--primary) 35%,transparent)}
.brand h1{font-size:1.1rem;font-weight:700}
.brand h1 span{color:var(--primary-2)}
.top-actions{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.theme-select{background:var(--panel);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:.45rem .7rem;font-size:.82rem;outline:none;cursor:pointer}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin-bottom:1.4rem}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:1.1rem 1.25rem;backdrop-filter:blur(12px)}
.stat-label{font-size:.7rem;color:var(--faint);margin-bottom:.3rem;
  text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat-value{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat-value.purple{color:var(--primary-2)}
.stat-value.cyan{color:var(--accent)}
.stat-value.pink{color:var(--pink)}

.toolbar{display:flex;gap:.75rem;margin-bottom:1.25rem}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--faint)}
.search-wrap input{width:100%;padding:.7rem 1rem .7rem 2.5rem;border-radius:12px;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  font-size:.9rem;outline:none;transition:.2s}
.search-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}

.btn{padding:.6rem 1.1rem;border:none;border-radius:11px;font-size:.85rem;
  font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:linear-gradient(135deg,var(--primary),#6a4be0);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px color-mix(in srgb,var(--primary) 35%,transparent)}
.btn-ghost{background:var(--panel);color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.btn-sm{padding:.35rem .7rem;font-size:.75rem;border-radius:8px}
.btn-danger{background:transparent;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,transparent)}
.btn-danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn-warn{background:transparent;color:var(--yellow);border:1px solid color-mix(in srgb,var(--yellow) 30%,transparent)}
.btn-warn:hover{background:var(--yellow);color:#1a1a1a;border-color:var(--yellow)}

.page-list{display:flex;flex-direction:column;gap:.6rem}
.page-item{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);
  padding:1rem 1.25rem;display:flex;align-items:center;gap:1rem;transition:.2s;
  backdrop-filter:blur(12px)}
.page-item:hover{border-color:var(--border-hi);background:var(--panel-2);transform:translateY(-1px)}
.page-icon{width:40px;height:40px;flex-shrink:0;background:color-mix(in srgb,var(--primary) 12%,transparent);
  border:1px solid color-mix(in srgb,var(--primary) 18%,transparent);border-radius:11px;
  display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.page-info{flex:1;min-width:0}
.page-title-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem;flex-wrap:wrap}
.page-title{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.65rem;padding:.18rem .55rem;border-radius:7px;font-weight:600}
.badge-private{background:color-mix(in srgb,var(--pink) 15%,transparent);color:var(--pink)}
.badge-safe{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.badge-medium{background:color-mix(in srgb,var(--yellow) 15%,transparent);color:var(--yellow)}
.badge-high{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.badge-public{background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent)}
.badge-admin{background:var(--panel-2);color:var(--muted)}
.badge-online{background:color-mix(in srgb,var(--green) 13%,transparent);color:var(--green)}
.badge-hidden{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.page-meta{font-size:.75rem;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap}
.page-meta span{display:inline-flex;align-items:center;gap:.25rem}
.page-desc{font-size:.75rem;color:var(--faint);margin-top:.25rem;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.page-actions{display:flex;gap:.35rem;flex-shrink:0;flex-wrap:wrap}

.empty{text-align:center;padding:4rem 2rem;background:var(--panel);
  border:1px dashed var(--border);border-radius:var(--radius)}
.empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.5}
.empty p{color:var(--muted);font-size:.9rem}
.empty button{margin-top:1rem}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(5,6,10,.75);
  backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--panel-2);border:1px solid var(--border);border-radius:18px;width:92%;
  max-width:820px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow);animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 1.5rem;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1rem;font-weight:600}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;
  background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;transition:.15s}
.modal-close:hover{background:var(--panel-2);color:var(--text)}
.modal-body{padding:1.5rem;overflow-y:auto;flex:1}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:.5rem;flex-wrap:wrap}

.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.75rem;color:var(--muted);
  margin-bottom:.35rem;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:.65rem .9rem;border-radius:11px;
  border:1px solid var(--border);background:color-mix(in srgb,var(--bg) 60%,transparent);color:var(--text);
  font-size:.9rem;outline:none;transition:.2s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--primary);
  box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 18%,transparent)}
.form-group textarea{font-family:'SF Mono',Monaco,'Cascadia Code',Consolas,monospace;
  font-size:.8rem;line-height:1.6;min-height:300px;resize:vertical;tab-size:2}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

.tool-row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin-bottom:.6rem}
.tool-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);
  border-radius:9px;padding:.4rem .8rem;font-size:.78rem;cursor:pointer;transition:.15s}
.tool-btn:hover{color:var(--text);border-color:var(--muted)}
.hint{font-size:.72rem;color:var(--faint)}

.drop-zone{border:2px dashed var(--border);border-radius:13px;padding:1.5rem;
  text-align:center;color:var(--muted);cursor:pointer;margin-bottom:1rem;transition:.2s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--primary);color:var(--primary-2);
  background:color-mix(in srgb,var(--primary) 5%,transparent)}
.drop-zone svg{width:28px;height:28px;margin-bottom:.5rem;opacity:.5}

.risk-box{border-radius:11px;padding:.9rem 1rem;margin-bottom:1rem;font-size:.83rem;line-height:1.6;display:none}
.risk-box.warn-medium{display:block;background:color-mix(in srgb,var(--yellow) 10%,transparent);border:1px solid color-mix(in srgb,var(--yellow) 30%,transparent);color:var(--yellow)}
.risk-box.warn-high{display:block;background:color-mix(in srgb,var(--red) 10%,transparent);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);color:var(--red)}
.risk-box ul{margin:.3rem 0 0 1.1rem}

.history-block{margin-top:1.2rem;border-top:1px solid var(--border);padding-top:1rem}
.history-block h3{font-size:.85rem;font-weight:600;margin-bottom:.6rem;color:var(--muted)}
.history-item{display:flex;align-items:center;gap:.75rem;padding:.55rem .8rem;
  border:1px solid var(--border);border-radius:10px;margin-bottom:.5rem;flex-wrap:wrap}
.history-item .h-meta{flex:1;min-width:0;font-size:.8rem;color:var(--muted)}
.history-empty{font-size:.78rem;color:var(--faint)}

.preview-frame{width:100%;height:60vh;border:1px solid var(--border);border-radius:11px;background:#fff}

.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--panel-2);padding:.7rem 1.3rem;border-radius:11px;border:1px solid var(--border);
  font-size:.85rem;opacity:0;transition:.3s;z-index:200;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  #app{padding:1.2rem 1.1rem}
  .stats{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .page-item{flex-wrap:wrap}
  .page-actions{width:100%;justify-content:flex-end}
  .topbar{gap:.7rem}
}
</style>
</head>
<body>

<div id="login">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <h1>HTML <span style="color:var(--primary-2)">Host</span></h1>
    <p>登录管理后台</p>
    <input type="password" id="login-pass" placeholder="管理密码"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <h1>HTML <span>Host</span> 管理后台</h1>
    </div>
    <div class="top-actions">
      <select class="theme-select" id="themeSelect" onchange="applyTheme(this.value)">
        <option value="dark-purple">🌙 暗夜紫</option>
        <option value="dark-cyan">🌊 深海青</option>
        <option value="light">☀️ 明亮浅</option>
        <option value="oled">⬛ 纯黑 OLED</option>
      </select>
      <button class="btn btn-ghost btn-sm" onclick="openPasswordModal()">修改密码</button>
      <button class="btn btn-primary" onclick="openEditor()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
        新建页面
      </button>
      <button class="btn btn-ghost" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="stat-label">页面总数</div><div class="stat-value purple" id="stat-pages">0</div></div>
    <div class="stat-card"><div class="stat-label">总浏览量</div><div class="stat-value cyan" id="stat-views">0</div></div>
    <div class="stat-card"><div class="stat-label">私密页面</div><div class="stat-value pink" id="stat-private">0</div></div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="搜索页面..." oninput="onSearchInput()">
    </div>
    <select class="theme-select" id="sortSelect" onchange="renderList()">
      <option value="updated">最新更新</option>
      <option value="views">最热浏览</option>
      <option value="expires">即将过期</option>
    </select>
  </div>

  <div class="page-list" id="pageList"></div>
</div>

<!-- EDITOR MODAL -->
<div class="modal-overlay" id="editorModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="editorTitle">新建页面</h2>
      <button class="modal-close" onclick="closeEditor()">✕</button>
    </div>
    <div class="modal-body">
      <div class="drop-zone" id="dropZone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <div>拖拽 HTML 文件到此处，或点击选择文件</div>
        <input type="file" id="fileInput" accept=".html,.htm" hidden>
      </div>
      <div class="risk-box" id="riskBox"></div>
      <div class="form-row">
        <div class="form-group">
          <label>URL 路径</label>
          <input id="f-path" placeholder="my-page（或 blog/post-1）">
        </div>
        <div class="form-group">
          <label>页面标题</label>
          <input id="f-title" placeholder="页面标题">
        </div>
      </div>
      <div class="form-group">
        <label>页面描述（用于分享卡片摘要，可选）</label>
        <input id="f-description" maxlength="200" placeholder="一句话介绍这个页面">
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>封面图链接（可选）</label>
          <input id="f-cover" placeholder="https://... 分享卡片大图">
        </div>
        <div class="form-group">
          <label>&nbsp;</label>
          <button class="tool-btn" onclick="pickCover()">📷 上传封面图</button>
        </div>
      </div>
      <div class="form-group">
        <label>访问密码（可选，留空则公开）</label>
        <input id="f-password" type="text" placeholder="设置后访问此页面需输入密码">
      </div>
      <div class="form-group">
        <label>HTML 内容</label>
        <div class="tool-row">
          <button class="tool-btn" onclick="pickImage()">🖼 插入图片</button>
          <span class="hint">图片将上传到图床并以直链插入</span>
        </div>
        <textarea id="f-content" placeholder="<!DOCTYPE html>..." oninput="scanRisk()"></textarea>
      </div>

      <div class="history-block">
        <h3>🕘 历史版本（最近 5 版）</h3>
        <div id="historyList"><div class="history-empty">保存后自动保留旧版本</div></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="openPreview()">预览</button>
      <button class="btn btn-ghost" onclick="closeEditor()">取消</button>
      <button class="btn btn-primary" onclick="savePage()">保存页面</button>
    </div>
  </div>
</div>

<!-- PREVIEW MODAL -->
<div class="modal-overlay" id="previewModal">
  <div class="modal">
    <div class="modal-header">
      <h2>沙箱预览</h2>
      <button class="modal-close" onclick="closePreview()">✕</button>
    </div>
    <div class="modal-body">
      <iframe class="preview-frame" id="previewFrame" sandbox="allow-forms allow-modals allow-popups allow-same-origin allow-scripts"></iframe>
    </div>
  </div>
</div>

<!-- QR MODAL -->
<div class="modal-overlay" id="qrModal">
  <div class="modal" style="max-width:360px">
    <div class="modal-header">
      <h2 id="qrTitle">分享二维码</h2>
      <button class="modal-close" onclick="closeQr()">✕</button>
    </div>
    <div class="modal-body" style="text-align:center">
      <img id="qrImg" alt="分享二维码" style="width:220px;height:220px;border-radius:12px;background:#fff;padding:10px">
      <div class="hint" id="qrUrl" style="margin-top:.8rem;word-break:break-all"></div>
    </div>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal-overlay" id="passwordModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h2>修改管理密码</h2>
      <button class="modal-close" onclick="closePasswordModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>当前密码</label>
        <input id="old-pass" type="password" placeholder="输入当前密码">
      </div>
      <div class="form-group">
        <label>新密码</label>
        <input id="new-pass" type="password" placeholder="输入新密码">
      </div>
      <div class="form-group">
        <label>确认新密码</label>
        <input id="confirm-pass" type="password" placeholder="再次输入新密码">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePasswordModal()">取消</button>
      <button class="btn btn-primary" onclick="changePassword()">确认修改</button>
    </div>
  </div>
</div>

<input type="file" id="imgInput" accept="image/*" hidden>
<input type="file" id="coverInput" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
const QR_API='https://api.qrserver.com/v1/create-qr-code/?size=280x280&margin=4&data=';
let token = sessionStorage.getItem('admin_token') || '';
let pages = [];
let editingPath = '';

function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  try{ localStorage.setItem('hh-theme', t); }catch(e){}
}
(function(){
  let t = 'dark-purple';
  try{ t = localStorage.getItem('hh-theme') || t; }catch(e){}
  document.documentElement.setAttribute('data-theme', t);
  const sel = document.getElementById('themeSelect');
  if(sel) sel.value = t;
})();

async function doLogin(){
  const p = document.getElementById('login-pass').value;
  const r = await fetch('/_api/auth',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:p})});
  const d = await r.json();
  if(d.ok){token=d.token;sessionStorage.setItem('admin_token',token);showApp();}
  else{toast('密码错误');}
}
function logout(){sessionStorage.removeItem('admin_token');token='';location.reload();}
function authHeaders(){return {'Content-Type':'application/json','Authorization':'Bearer '+token};}

async function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  await loadList();
}
async function loadList(){
  const r = await fetch('/_api/list',{headers:authHeaders()});
  const d = await r.json();
  pages = d.pages || [];
  document.getElementById('stat-pages').textContent = pages.length;
  document.getElementById('stat-views').textContent = pages.reduce((s,p)=>s+(p.views||0),0);
  document.getElementById('stat-private').textContent = pages.filter(p=>p.has_password).length;
  renderList();
}

function riskBadge(risk){
  if(risk==='high') return '<span class="badge badge-high">⚠ 高风险</span>';
  if(risk==='medium') return '<span class="badge badge-medium">◐ 中风险</span>';
  return '<span class="badge badge-safe">✓ 安全</span>';
}
function ownerBadge(owner){
  if(owner==='public') return '<span class="badge badge-public">🌐 投稿</span>';
  return '<span class="badge badge-admin">📌 管理员</span>';
}
function statusBadge(status){
  if(status==='hidden') return '<span class="badge badge-hidden">⛔ 已下架</span>';
  return '<span class="badge badge-online">🟢 已发布</span>';
}

function renderList(){
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('pageList');
  const filtered = pages.filter(p =>
    p.path.toLowerCase().includes(q) || (p.title||'').toLowerCase().includes(q) ||
    (p.description||'').toLowerCase().includes(q));
  const sort = document.getElementById('sortSelect').value;
  const sorted = [...filtered];
  if(sort === 'views'){
    sorted.sort((a,b)=>(b.views||0)-(a.views||0));
  }else if(sort === 'expires'){
    sorted.sort((a,b)=>{
      const ea=(a.expires_at&&a.expires_at>0)?a.expires_at:Number.MAX_SAFE_INTEGER;
      const eb=(b.expires_at&&b.expires_at>0)?b.expires_at:Number.MAX_SAFE_INTEGER;
      return ea-eb;
    });
  }else{
    sorted.sort((a,b)=>(b.updated_at||0)-(a.updated_at||0));
  }
  if(!filtered.length){
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">📄</div>
      <p>还没有页面，点击「新建页面」创建你的第一个页面</p>
      <button class="btn btn-primary" onclick="openEditor()">+ 新建页面</button>
    </div>`;
    return;
  }
  list.innerHTML = sorted.map(p => {
    const date = new Date(p.updated_at*1000).toLocaleDateString('zh-CN');
    let expire = '';
    if(p.expires_at && p.expires_at > 0){
      expire = `<span>⏳ ${new Date(p.expires_at*1000).toLocaleDateString('zh-CN')} 过期</span>`;
    }
    const hidden = p.status === 'hidden';
    const toggleBtn = hidden
      ? `<button class="btn btn-ghost btn-sm" onclick="toggleStatus('${esc(p.path)}','hidden')">恢复</button>`
      : `<button class="btn btn-warn btn-sm" onclick="toggleStatus('${esc(p.path)}','approved')">下架</button>`;
    const desc = p.description ? `<div class="page-desc">${esc(p.description)}</div>` : '';
    return `<div class="page-item">
      <div class="page-icon">📄</div>
      <div class="page-info">
        <div class="page-title-row">
          <div class="page-title">${esc(p.title||p.path)}</div>
          ${ownerBadge(p.owner)}
          ${statusBadge(p.status)}
          ${p.has_password?'<span class="badge badge-private">🔒 私密</span>':''}
          ${riskBadge(p.risk)}
        </div>
        <div class="page-meta">
          <span>/${esc(p.path)}</span>
          <span>👁 ${p.views||0} 次浏览</span>
          ${expire}
          <span>📅 ${date}</span>
        </div>
        ${desc}
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost btn-sm" onclick="window.open('/${esc(p.path)}','_blank')">访问</button>
        <button class="btn btn-ghost btn-sm" onclick="editPage('${esc(p.path)}')">编辑</button>
        <button class="btn btn-ghost btn-sm" onclick="clonePage('${esc(p.path)}')">克隆</button>
        <button class="btn btn-ghost btn-sm" onclick="downloadPage('${esc(p.path)}','${esc(p.title||p.path)}')">下载源码</button>
        <button class="btn btn-ghost btn-sm" onclick="showQr('${esc(p.path)}','${esc(p.title||p.path)}')">二维码</button>
        ${toggleBtn}
        <button class="btn btn-danger btn-sm" onclick="delPage('${esc(p.path)}','${esc(p.title||p.path)}')">删除</button>
      </div>
    </div>`;
  }).join('');
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
let searchTimer;
function onSearchInput(){clearTimeout(searchTimer);searchTimer=setTimeout(renderList,150)}

function scanHtml(html){
  const warnings=[];
  if(/<script[\s>]/i.test(html)) warnings.push('包含 <script> 脚本标签');
  if(/on\w+\s*=/i.test(html)) warnings.push('包含内联事件处理器（onclick 等）');
  if(/javascript:/i.test(html)) warnings.push('包含 javascript: 伪协议链接');
  if(/<iframe/i.test(html)) warnings.push('包含 iframe 嵌入');
  if(/<form/i.test(html)) warnings.push('包含表单（可能用于钓鱼）');
  if(/url\(\s*['"]?https?:/i.test(html)) warnings.push('引用了外部资源');
  let risk='safe';
  if(warnings.length>=3) risk='high'; else if(warnings.length>=1) risk='medium';
  return {risk,warnings};
}
function scanRisk(){
  const html=document.getElementById('f-content').value;
  const box=document.getElementById('riskBox');
  if(!html.trim()){box.className='risk-box';box.innerHTML='';return;}
  const {risk,warnings}=scanHtml(html);
  if(risk==='safe'){box.className='risk-box';box.innerHTML='';return;}
  const cls=risk==='high'?'warn-high':'warn-medium';
  const title=risk==='high'?'⚠ 高风险内容，请确认来源可信':'◐ 包含潜在风险元素';
  box.className='risk-box '+cls;
  box.innerHTML=`<strong>${title}</strong><ul>${warnings.map(w=>`<li>${w}</li>`).join('')}</ul>`;
}

function openEditor(){
  editingPath='';
  document.getElementById('editorTitle').textContent='新建页面';
  document.getElementById('f-path').value='';
  document.getElementById('f-title').value='';
  document.getElementById('f-description').value='';
  document.getElementById('f-cover').value='';
  document.getElementById('f-password').value='';
  document.getElementById('f-content').value='<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<title>新页面</title>\n</head>\n<body>\n<h1>Hello World</h1>\n</body>\n</html>';
  document.getElementById('historyList').innerHTML='<div class="history-empty">保存后自动保留旧版本</div>';
  document.getElementById('riskBox').className='risk-box';document.getElementById('riskBox').innerHTML='';
  document.getElementById('editorModal').classList.add('active');
}
function closeEditor(){document.getElementById('editorModal').classList.remove('active')}
async function editPage(path){
  const r = await fetch('/_api/page/'+path,{headers:authHeaders()});
  if(!r.ok){toast('加载失败');return}
  const d = await r.json();
  editingPath = path;
  document.getElementById('editorTitle').textContent='编辑：'+path;
  document.getElementById('f-path').value=d.meta.path;
  document.getElementById('f-title').value=d.meta.title||'';
  document.getElementById('f-description').value=d.meta.description||'';
  document.getElementById('f-cover').value=d.meta.cover||'';
  document.getElementById('f-password').value=d.meta.password||'';
  document.getElementById('f-content').value=d.content;
  scanRisk();
  await loadHistory(path);
  document.getElementById('editorModal').classList.add('active');
}
async function downloadPage(path,title){
  try{
    const r=await fetch('/_api/page/'+path,{headers:authHeaders()});
    if(!r.ok){toast('加载失败');return}
    const d=await r.json();
    if(!d.content){toast('内容为空');return}
    const blob=new Blob([d.content],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=String(title||path).replace(/[\\/:*?"<>|]/g,'_')+'.html';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href)},1000);
    toast('源码已下载');
  }catch(e){toast('下载失败，请重试')}
}
async function clonePage(path){
  try{
    const r=await fetch('/_api/page/'+path,{headers:authHeaders()});
    if(!r.ok){toast('加载失败');return}
    const d=await r.json();
    editingPath='';
    document.getElementById('editorTitle').textContent='克隆自：'+path;
    document.getElementById('f-path').value='';
    document.getElementById('f-title').value=(d.meta.title||'副本')+' 副本';
    document.getElementById('f-description').value=d.meta.description||'';
    document.getElementById('f-cover').value=d.meta.cover||'';
    document.getElementById('f-password').value='';
    document.getElementById('f-content').value=d.content;
    scanRisk();
    document.getElementById('editorModal').classList.add('active');
    toast('已载入副本，请填写新路径后保存');
  }catch(e){toast('克隆失败，请重试')}
}
async function savePage(){
  const path=document.getElementById('f-path').value.trim();
  const title=document.getElementById('f-title').value.trim();
  const description=document.getElementById('f-description').value.trim();
  const cover=document.getElementById('f-cover').value.trim();
  const password=document.getElementById('f-password').value;
  const content=document.getElementById('f-content').value;
  if(!path){toast('请填写 URL 路径');return}
  const r = await fetch('/_api/upload',{method:'POST',headers:authHeaders(),
    body:JSON.stringify({path,title,description,cover,password,content})});
  const d = await r.json();
  if(d.ok){
    if(d.risk==='high') toast('⚠ 已保存，但标记为高风险');
    else if(d.risk==='medium') toast('◐ 已保存，包含中风险元素');
    else toast('✅ 已保存，访问地址：/'+d.path);
    closeEditor();loadList();
  } else {toast(d.error||'保存失败');}
}
async function delPage(path,title){
  if(!confirm('确定删除「'+title+'」吗？此操作不可撤销。'))return;
  const r = await fetch('/_api/page/'+path,{method:'DELETE',headers:authHeaders()});
  if(r.ok){toast('已删除');loadList()}
}
async function toggleStatus(path,current){
  const next = current==='hidden' ? 'approved' : 'hidden';
  const r = await fetch('/_api/page/'+path+'/status',{method:'POST',headers:authHeaders(),
    body:JSON.stringify({status:next})});
  if(r.ok){toast(next==='hidden'?'已下架，公开访问将不可见':'已恢复上线');loadList()}
  else toast('操作失败');
}

// ---- history ----
async function loadHistory(path){
  const box=document.getElementById('historyList');
  const r=await fetch('/_api/history/'+path,{headers:authHeaders()});
  const d=await r.json();
  const hist=d.history||[];
  if(!hist.length){box.innerHTML='<div class="history-empty">暂无历史版本</div>';return}
  box.innerHTML=hist.map(h=>{
    const date=new Date(h.ts*1000).toLocaleString('zh-CN');
    const kb=(h.size/1024).toFixed(1);
    return `<div class="history-item">
      <div class="h-meta">🕘 ${date} · ${kb} KB</div>
      <button class="btn btn-ghost btn-sm" onclick="viewHistory('${esc(path)}',${h.ts})">查看</button>
      <button class="btn btn-warn btn-sm" onclick="restoreHistory('${esc(path)}',${h.ts})">回滚</button>
    </div>`;
  }).join('');
}
async function viewHistory(path,ts){
  const r=await fetch('/_api/history/'+path+'/'+ts,{headers:authHeaders()});
  const d=await r.json();
  if(d.content!=null){
    document.getElementById('f-content').value=d.content;
    scanRisk();toast('已载入该版本，保存后生效');
  } else toast('版本读取失败');
}
async function restoreHistory(path,ts){
  if(!confirm('确定回滚到该版本吗？当前版本会先保留为一条历史。'))return;
  const r=await fetch('/_api/history/'+path+'/restore',{method:'POST',headers:authHeaders(),
    body:JSON.stringify({ts})});
  const d=await r.json();
  if(d.ok){toast('已回滚到历史版本');closeEditor();loadList()}
  else toast(d.error||'回滚失败');
}

// ---- image upload to TG host ----
function insertAtCursor(ta,text){
  const s=ta.selectionStart||0,e=ta.selectionEnd||0;
  ta.value=ta.value.slice(0,s)+text+ta.value.slice(e);
  ta.focus();
}
async function uploadImage(file){
  const fd=new FormData();fd.append('file',file);
  const r=await fetch('/_api/upload-image',{method:'POST',headers:{'Authorization':'Bearer '+token},body:fd});
  const d=await r.json();
  if(!d.ok) throw new Error(d.error||'上传失败');
  return d.url;
}
function pickImage(){document.getElementById('imgInput').click()}
document.getElementById('imgInput').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const url=await uploadImage(f);
    insertAtCursor(document.getElementById('f-content'),`<img src="${url}" alt="">`);
    toast('图片已插入');
  }catch(err){toast(err.message)}
};
function pickCover(){document.getElementById('coverInput').click()}
document.getElementById('coverInput').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const url=await uploadImage(f);
    document.getElementById('f-cover').value=url;toast('封面图已设置');
  }catch(err){toast(err.message)}
};

function openPreview(){
  const content=document.getElementById('f-content').value;
  const frame=document.getElementById('previewFrame');
  frame.srcdoc=content;
  document.getElementById('previewModal').classList.add('active');
}
function closePreview(){document.getElementById('previewModal').classList.remove('active')}

function showQr(path,title){
  const url=location.origin+'/'+path;
  document.getElementById('qrTitle').textContent='二维码 · '+title;
  document.getElementById('qrUrl').textContent=url;
  document.getElementById('qrImg').src=QR_API+encodeURIComponent(url);
  document.getElementById('qrModal').classList.add('active');
}
function closeQr(){document.getElementById('qrModal').classList.remove('active')}

function openPasswordModal(){
  document.getElementById('old-pass').value='';
  document.getElementById('new-pass').value='';
  document.getElementById('confirm-pass').value='';
  document.getElementById('passwordModal').classList.add('active');
}
function closePasswordModal(){document.getElementById('passwordModal').classList.remove('active')}
async function changePassword(){
  const oldP=document.getElementById('old-pass').value;
  const newP=document.getElementById('new-pass').value;
  const confirmP=document.getElementById('confirm-pass').value;
  if(!oldP||!newP){toast('请填写完整');return}
  if(newP!==confirmP){toast('两次输入的新密码不一致');return}
  if(newP.length<6){toast('新密码至少6位');return}
  const r=await fetch('/_api/change-password',{method:'POST',headers:authHeaders(),
    body:JSON.stringify({oldPassword:oldP,newPassword:newP})});
  const d=await r.json();
  if(d.ok){token=newP;sessionStorage.setItem('admin_token',newP);toast('✅ 密码已修改');closePasswordModal();}
  else{toast(d.error||'修改失败');}
}

const dropZone=document.getElementById('dropZone');
const fileInput=document.getElementById('fileInput');
dropZone.onclick=()=>fileInput.click();
dropZone.ondragover=e=>{e.preventDefault();dropZone.classList.add('dragover')};
dropZone.ondragleave=()=>dropZone.classList.remove('dragover');
dropZone.ondrop=e=>{e.preventDefault();dropZone.classList.remove('dragover');
  if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0])};
fileInput.onchange=e=>{if(e.target.files[0]) readFile(e.target.files[0])};
function readFile(f){
  const reader=new FileReader();
  reader.onload=()=>{
    document.getElementById('f-content').value=reader.result;
    document.getElementById('f-title').value=f.name.replace(/\.html?$/i,'');
    if(!document.getElementById('f-path').value){
      document.getElementById('f-path').value=f.name.replace(/\.html?$/i,'')
        .toLowerCase().replace(/[^a-z0-9-_]/g,'-');
    }
    scanRisk();
    toast('已加载：'+f.name);
  };
  reader.readAsText(f);
}

let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2500);
}

if(token){showApp()}
</script>
</body>
</html>
