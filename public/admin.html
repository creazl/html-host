<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML Host · 管理后台</title>
<style>
:root{
  --bg:#0a0a12;--surface:#16162a;--surface2:#1c1c35;--border:#262645;
  --text:#e8e8f0;--muted:#7a7a9e;--accent:#7c5cfc;--accent-hover:#9078ff;
  --accent-glow:rgba(124,92,252,.25);--pink:#ff6b9d;--cyan:#4dd6ff;
  --green:#3ddc97;--red:#ff5c7c;--radius:12px;--shadow:0 8px 32px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:radial-gradient(ellipse 600px 400px at 20% 0%,rgba(124,92,252,.12),transparent),
             radial-gradient(ellipse 500px 300px at 80% 100%,rgba(77,214,255,.08),transparent)}

/* LOGIN */
#login{display:flex;align-items:center;justify-content:center;height:100vh}
.login-card{background:linear-gradient(145deg,var(--surface),#11111c);
  border:1px solid var(--border);border-radius:20px;padding:2.5rem;width:360px;
  box-shadow:var(--shadow);text-align:center}
.login-logo{width:56px;height:56px;margin:0 auto 1rem;
  background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:16px;
  display:flex;align-items:center;justify-content:center;font-size:1.6rem;
  box-shadow:0 8px 24px var(--accent-glow)}
.login-card h1{font-size:1.3rem;font-weight:700;margin-bottom:.25rem}
.login-card p{color:var(--muted);font-size:.85rem;margin-bottom:2rem}
.login-card input{width:100%;padding:.8rem 1rem;border-radius:10px;border:1px solid var(--border);
  background:#0a0a12;color:var(--text);font-size:.95rem;margin-bottom:1rem;outline:none;transition:.2s}
.login-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}
.login-card button{width:100%;padding:.8rem;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--accent),#5a3df0);color:#fff;
  font-size:.95rem;font-weight:600;cursor:pointer;transition:.2s}
.login-card button:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}

/* APP */
#app{display:none;max-width:1080px;margin:0 auto;padding:2rem 1.5rem}
.topbar{display:flex;align-items:center;justify-content:space-between;
  margin-bottom:2rem;padding-bottom:1.25rem;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:.75rem}
.brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),var(--pink));
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem;
  box-shadow:0 4px 12px var(--accent-glow)}
.brand h1{font-size:1.1rem;font-weight:700}
.brand h1 span{background:linear-gradient(135deg,var(--accent-hover),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.top-actions{display:flex;gap:.5rem;align-items:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-bottom:1.5rem}
.stat-card{background:linear-gradient(145deg,var(--surface),#11111c);
  border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.25rem}
.stat-label{font-size:.7rem;color:var(--muted);margin-bottom:.3rem;
  text-transform:uppercase;letter-spacing:.5px}
.stat-value{font-size:1.6rem;font-weight:700}
.stat-value.purple{color:var(--accent-hover)}
.stat-value.cyan{color:var(--cyan)}
.stat-value.pink{color:var(--pink)}

/* toolbar */
.toolbar{display:flex;gap:.75rem;margin-bottom:1.25rem}
.search-wrap{position:relative;flex:1}
.search-wrap svg{position:absolute;left:.9rem;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted)}
.search-wrap input{width:100%;padding:.65rem 1rem .65rem 2.5rem;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);color:var(--text);
  font-size:.9rem;outline:none;transition:.2s}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow)}

/* buttons */
.btn{padding:.6rem 1.1rem;border:none;border-radius:10px;font-size:.85rem;
  font-weight:600;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:.4rem}
.btn-primary{background:linear-gradient(135deg,var(--accent),#5a3df0);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
.btn-ghost{background:var(--surface);color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{color:var(--text);border-color:var(--muted)}
.btn-sm{padding:.35rem .7rem;font-size:.75rem;border-radius:8px}
.btn-danger{background:transparent;color:var(--red);border:1px solid rgba(255,92,124,.3)}
.btn-danger:hover{background:var(--red);color:#fff;border-color:var(--red)}

/* page list */
.page-list{display:flex;flex-direction:column;gap:.6rem}
.page-item{background:linear-gradient(145deg,var(--surface),#11111c);
  border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.25rem;
  display:flex;align-items:center;gap:1rem;transition:.2s}
.page-item:hover{border-color:rgba(124,92,252,.4);transform:translateY(-1px)}
.page-icon{width:40px;height:40px;flex-shrink:0;background:rgba(124,92,252,.12);
  border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.page-info{flex:1;min-width:0}
.page-title-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.2rem}
.page-title{font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{font-size:.65rem;padding:.15rem .5rem;border-radius:6px;font-weight:600}
.badge-private{background:rgba(255,107,157,.15);color:var(--pink)}
.page-meta{font-size:.75rem;color:var(--muted);display:flex;gap:1rem;flex-wrap:wrap}
.page-meta span{display:inline-flex;align-items:center;gap:.25rem}
.page-actions{display:flex;gap:.35rem;flex-shrink:0}

/* empty */
.empty{text-align:center;padding:4rem 2rem;background:var(--surface);
  border:1px dashed var(--border);border-radius:var(--radius)}
.empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.5}
.empty p{color:var(--muted);font-size:.9rem}
.empty button{margin-top:1rem}

/* modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center}
.modal-overlay.active{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(145deg,var(--surface),#11111c);
  border:1px solid var(--border);border-radius:16px;width:92%;max-width:820px;
  max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--shadow);animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-header{display:flex;align-items:center;justify-content:space-between;
  padding:1.1rem 1.5rem;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1rem;font-weight:600}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;
  background:transparent;color:var(--muted);font-size:1rem;cursor:pointer;transition:.15s}
.modal-close:hover{background:var(--surface2);color:var(--text)}
.modal-body{padding:1.5rem;overflow-y:auto;flex:1}
.modal-footer{padding:1rem 1.5rem;border-top:1px solid var(--border);
  display:flex;justify-content:flex-end;gap:.5rem}

/* form */
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.75rem;color:var(--muted);
  margin-bottom:.35rem;font-weight:500}
.form-group input,.form-group textarea{width:100%;padding:.65rem .9rem;border-radius:10px;
  border:1px solid var(--border);background:#0a0a12;color:var(--text);
  font-size:.9rem;outline:none;transition:.2s}
.form-group input:focus,.form-group textarea:focus{border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow)}
.form-group textarea{font-family:'SF Mono',Monaco,'Cascadia Code',Consolas,monospace;
  font-size:.8rem;line-height:1.6;min-height:320px;resize:vertical;tab-size:2}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}

/* drop zone */
.drop-zone{border:2px dashed var(--border);border-radius:12px;padding:1.5rem;
  text-align:center;color:var(--muted);cursor:pointer;margin-bottom:1rem;transition:.2s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);color:var(--accent-hover);
  background:rgba(124,92,252,.05)}
.drop-zone svg{width:28px;height:28px;margin-bottom:.5rem;opacity:.5}

/* toast */
.toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(10px);
  background:var(--surface2);padding:.7rem 1.3rem;border-radius:10px;
  border:1px solid var(--border);font-size:.85rem;opacity:0;transition:.3s;z-index:200;
  box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .stats{grid-template-columns:1fr 1fr}
  .form-row{grid-template-columns:1fr}
  .page-item{flex-wrap:wrap}
  .page-actions{width:100%;justify-content:flex-end}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">⚡</div>
    <h1>HTML <span style="background:linear-gradient(135deg,var(--accent-hover),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Host</span></h1>
    <p>登录管理后台</p>
    <input type="password" id="login-pass" placeholder="管理密码"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">登 录</button>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">⚡</div>
      <h1>HTML <span>Host</span> 管理后台</h1>
    </div>
    <div class="top-actions">
      <button class="btn btn-ghost btn-sm" onclick="openPasswordModal()">修改密码</button>
      <button class="btn btn-primary" onclick="openEditor()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg>
        新建页面
      </button>
      <button class="btn btn-ghost" onclick="logout()">退出</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">页面总数</div>
      <div class="stat-value purple" id="stat-pages">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">总浏览量</div>
      <div class="stat-value cyan" id="stat-views">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">私密页面</div>
      <div class="stat-value pink" id="stat-private">0</div>
    </div>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="search" placeholder="搜索页面..." oninput="renderList()">
    </div>
  </div>

  <div class="page-list" id="pageList"></div>
</div>

<!-- EDITOR MODAL -->
<div class="modal-overlay" id="editorModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="editorTitle">新建页面</h2>
      <button class="modal-close" onclick="closeEditor()">✕</button>
    </div>
    <div class="modal-body">
      <div class="drop-zone" id="dropZone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
        <div>拖拽 HTML 文件到此处，或点击选择文件</div>
        <input type="file" id="fileInput" accept=".html,.htm" hidden>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>URL 路径</label>
          <input id="f-path" placeholder="my-page（或 blog/post-1）">
        </div>
        <div class="form-group">
          <label>页面标题</label>
          <input id="f-title" placeholder="页面标题">
        </div>
      </div>
      <div class="form-group">
        <label>访问密码（可选，留空则公开）</label>
        <input id="f-password" type="text" placeholder="设置后访问此页面需输入密码">
      </div>
      <div class="form-group">
        <label>HTML 内容</label>
        <textarea id="f-content" placeholder="<!DOCTYPE html>..."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeEditor()">取消</button>
      <button class="btn btn-primary" onclick="savePage()">保存页面</button>
    </div>
  </div>
</div>

<!-- PASSWORD MODAL -->
<div class="modal-overlay" id="passwordModal">
  <div class="modal" style="max-width:420px">
    <div class="modal-header">
      <h2>修改管理密码</h2>
      <button class="modal-close" onclick="closePasswordModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>当前密码</label>
        <input id="old-pass" type="password" placeholder="输入当前密码">
      </div>
      <div class="form-group">
        <label>新密码</label>
        <input id="new-pass" type="password" placeholder="输入新密码">
      </div>
      <div class="form-group">
        <label>确认新密码</label>
        <input id="confirm-pass" type="password" placeholder="再次输入新密码">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closePasswordModal()">取消</button>
      <button class="btn btn-primary" onclick="changePassword()">确认修改</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let token = sessionStorage.getItem('admin_token') || '';
let pages = [];

async function doLogin(){
  const p = document.getElementById('login-pass').value;
  const r = await fetch('/_api/auth',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({password:p})});
  const d = await r.json();
  if(d.ok){
    token = d.token;
    sessionStorage.setItem('admin_token',token);
    showApp();
  } else { toast('密码错误'); }
}
function logout(){
  sessionStorage.removeItem('admin_token'); token=''; location.reload();
}
function authHeaders(){
  return {'Content-Type':'application/json','Authorization':'Bearer '+token};
}

async function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  await loadList();
}
async function loadList(){
  const r = await fetch('/_api/list',{headers:authHeaders()});
  const d = await r.json();
  pages = d.pages || [];
  document.getElementById('stat-pages').textContent = pages.length;
  document.getElementById('stat-views').textContent = pages.reduce((s,p)=>s+(p.views||0),0);
  document.getElementById('stat-private').textContent = pages.filter(p=>p.has_password).length;
  renderList();
}
function renderList(){
  const q = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('pageList');
  const filtered = pages.filter(p =>
    p.path.toLowerCase().includes(q) || (p.title||'').toLowerCase().includes(q));
  if(!filtered.length){
    list.innerHTML = `<div class="empty">
      <div class="empty-icon">📄</div>
      <p>还没有页面，点击「新建页面」创建你的第一个页面</p>
      <button class="btn btn-primary" onclick="openEditor()">+ 新建页面</button>
    </div>`;
    return;
  }
  list.innerHTML = filtered.map(p => {
    const date = new Date(p.updated_at*1000).toLocaleDateString('zh-CN');
    return `<div class="page-item">
      <div class="page-icon">📄</div>
      <div class="page-info">
        <div class="page-title-row">
          <div class="page-title">${esc(p.title||p.path)}</div>
          ${p.has_password?'<span class="badge badge-private">🔒 私密</span>':''}
        </div>
        <div class="page-meta">
          <span>/${esc(p.path)}</span>
          <span>👁 ${p.views||0} 次浏览</span>
          <span>📅 ${date}</span>
        </div>
      </div>
      <div class="page-actions">
        <button class="btn btn-ghost btn-sm" onclick="window.open('/${esc(p.path)}','_blank')">访问</button>
        <button class="btn btn-ghost btn-sm" onclick="editPage('${esc(p.path)}')">编辑</button>
        <button class="btn btn-danger btn-sm" onclick="delPage('${esc(p.path)}','${esc(p.title||p.path)}')">删除</button>
      </div>
    </div>`;
  }).join('');
}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}

function openEditor(){
  window.__editPath = null;
  document.getElementById('editorTitle').textContent = '新建页面';
  document.getElementById('f-path').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-password').value = '';
  document.getElementById('f-content').value = '<!DOCTYPE html>\n<html lang="zh-CN">\n<head>\n<meta charset="utf-8">\n<title>新页面</title>\n</head>\n<body>\n<h1>Hello World</h1>\n</body>\n</html>';
  document.getElementById('editorModal').classList.add('active');
}
function closeEditor(){document.getElementById('editorModal').classList.remove('active')}
async function editPage(path){
  window.__editPath = path;
  const r = await fetch('/_api/page/'+path,{headers:authHeaders()});
  if(!r.ok){toast('加载失败');return}
  const d = await r.json();
  document.getElementById('editorTitle').textContent = '编辑：'+path;
  document.getElementById('f-path').value = d.meta.path;
  document.getElementById('f-title').value = d.meta.title||'';
  document.getElementById('f-password').value = d.meta.password||'';
  document.getElementById('f-content').value = d.content;
  document.getElementById('editorModal').classList.add('active');
}
async function savePage(){
  const path = document.getElementById('f-path').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const password = document.getElementById('f-password').value;
  const content = document.getElementById('f-content').value;
  if(!path){toast('请填写 URL 路径');return}
  const r = await fetch('/_api/upload',{method:'POST',headers:authHeaders(),
    body:JSON.stringify({path,title,password,content})});
  const d = await r.json();
  if(d.ok){toast('✅ 已保存，访问地址：/'+d.path);closeEditor();loadList()}
  else{toast(d.error||'保存失败')}
}
async function delPage(path,title){
  if(!confirm('确定删除「'+title+'」吗？此操作不可撤销。'))return;
  const r = await fetch('/_api/page/'+path,{method:'DELETE',headers:authHeaders()});
  if(r.ok){toast('已删除');loadList()}
}

// password change
function openPasswordModal(){
  document.getElementById('old-pass').value='';
  document.getElementById('new-pass').value='';
  document.getElementById('confirm-pass').value='';
  document.getElementById('passwordModal').classList.add('active');
}
function closePasswordModal(){document.getElementById('passwordModal').classList.remove('active')}
async function changePassword(){
  const oldP = document.getElementById('old-pass').value;
  const newP = document.getElementById('new-pass').value;
  const confirmP = document.getElementById('confirm-pass').value;
  if(!oldP||!newP){toast('请填写完整');return}
  if(newP!==confirmP){toast('两次输入的新密码不一致');return}
  if(newP.length<6){toast('新密码至少6位');return}
  const r = await fetch('/_api/change-password',{method:'POST',headers:authHeaders(),
    body:JSON.stringify({oldPassword:oldP,newPassword:newP})});
  const d = await r.json();
  if(d.ok){
    token = newP;
    sessionStorage.setItem('admin_token',newP);
    toast('✅ 密码已修改');
    closePasswordModal();
  } else { toast(d.error||'修改失败'); }
}

// file upload
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
dropZone.onclick = () => fileInput.click();
dropZone.ondragover = e => {e.preventDefault();dropZone.classList.add('dragover')};
dropZone.ondragleave = () => dropZone.classList.remove('dragover');
dropZone.ondrop = e => {e.preventDefault();dropZone.classList.remove('dragover');
  if(e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0])};
fileInput.onchange = e => {if(e.target.files[0]) readFile(e.target.files[0])};
function readFile(f){
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('f-content').value = reader.result;
    document.getElementById('f-title').value = f.name.replace(/\.html?$/i,'');
    if(!document.getElementById('f-path').value){
      document.getElementById('f-path').value = f.name.replace(/\.html?$/i,'')
        .toLowerCase().replace(/[^a-z0-9-_]/g,'-');
    }
    toast('已加载：'+f.name);
  };
  reader.readAsText(f);
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'),2500);
}

if(token){showApp()}
</script>
</body>
</html>
